name: ci
on:
  push:
    branches: [main]
    paths-ignore: [site/**, docs/**]
  pull_request:
    paths-ignore: [site/**, docs/**]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
